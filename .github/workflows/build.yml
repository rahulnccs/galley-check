name: Build apps

# Builds the Mac and Windows apps. Runs on every push so breakage is caught
# early; when a version tag is pushed (e.g. v0.2.0) the finished installers are
# attached to a GitHub release for people to download.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller pillow

      - name: Build the icon
        run: |
          python packaging/make_icon.py
          mkdir -p packaging/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png \
              --out packaging/icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size*2)) $((size*2)) packaging/icon.png \
              --out packaging/icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns

      - name: Build the app
        run: pyinstaller --noconfirm --log-level WARN packaging/galley.spec

      - name: Check the app was built
        run: |
          test -d "dist/Galley.app"
          test -x "dist/Galley.app/Contents/MacOS/Galley"
          # Only the bundle layout is verified: launching the app here would
          # open a window and wait forever on a runner with no screen.

      - name: Package as a .dmg
        run: |
          mkdir -p dmg
          cp -R "dist/Galley.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Galley" -srcfolder dmg \
            -ov -format UDZO "dist/Galley-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Galley-macOS
          path: dist/Galley-macOS.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Galley-macOS.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller pillow

      - name: Build the icon
        run: python packaging/make_icon.py

      - name: Build the app
        run: pyinstaller --noconfirm --log-level WARN packaging/galley.spec

      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Galley-Windows
          path: dist/Galley-Setup.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Galley-Setup.exe
