name: Build apps

# Builds the Mac and Windows apps. Runs on every push so breakage is caught
# early. To release, push a version tag (e.g. v1.6.0), or run this workflow
# by hand with the version filled in: the finished installers are attached to
# a release of that name in the public repository, rahulnccs/galley, where
# people download them (or in this repository while PUBLIC_REPO_TOKEN isn't
# set, so a release never goes out without its apps).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. v1.6.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Secrets can't be tested in an `if:` directly; this can.
  HAS_PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN != '' }}

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller pillow

      - name: Build the icon
        run: |
          python packaging/make_icon.py
          mkdir -p packaging/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png \
              --out packaging/icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size*2)) $((size*2)) packaging/icon.png \
              --out packaging/icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns

      - name: Build the app
        run: pyinstaller --noconfirm --log-level WARN packaging/galley.spec

      - name: Check the app was built
        run: |
          test -d "dist/Galley.app"
          test -x "dist/Galley.app/Contents/MacOS/Galley"
          # Only the bundle layout is verified: launching the app here would
          # open a window and wait forever on a runner with no screen.

      - name: Package as a .dmg
        run: |
          mkdir -p dmg
          cp -R "dist/Galley.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Galley" -srcfolder dmg \
            -ov -format UDZO "dist/Galley-macOS.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: Galley-macOS
          path: dist/Galley-macOS.dmg


  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller pillow

      - name: Build the icon
        run: python packaging/make_icon.py

      - name: Build the app
        run: pyinstaller --noconfirm --log-level WARN packaging/galley.spec

      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - uses: actions/upload-artifact@v6
        with:
          name: Galley-Windows
          path: dist/Galley-Setup.exe

  release:
    name: Publish the release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect the apps built above
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --dir dist
          find dist -type f

      - name: Create or update the release
        env:
          TAG: ${{ inputs.release || github.ref_name }}
          PUBLIC: ${{ env.HAS_PUBLIC_TOKEN }}
          GH_TOKEN: ${{ env.HAS_PUBLIC_TOKEN == 'true' && secrets.PUBLIC_REPO_TOKEN || github.token }}
        run: |
          if [ "$PUBLIC" = "true" ]; then
            REPO=rahulnccs/galley
            TARGET=()
          else
            REPO=${{ github.repository }}
            TARGET=(--target ${{ github.sha }})
            echo "::warning::PUBLIC_REPO_TOKEN isn't set, so the release was made in this repository instead of rahulnccs/galley. See Releasing in the README."
          fi
          NOTES=".github/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "Galley $TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          mapfile -t FILES < <(find dist -type f \( -name '*.dmg' -o -name '*.exe' \))
          [ "${#FILES[@]}" -eq 2 ] || { echo "::error::Expected the Mac and Windows apps, found: ${FILES[*]}"; exit 1; }
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$REPO" --title "Galley $TAG" \
              --notes-file "$NOTES" "${TARGET[@]}"
          fi
          echo "Released $TAG to https://github.com/$REPO/releases/tag/$TAG"
